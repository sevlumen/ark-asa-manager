[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"

[agents."luna-ba"]
description = "Clarify requirements and acceptance criteria; no implementation."
config_file = "agents/luna-ba.toml"

[agents."luna-planner"]
description = "Plan files, dependencies, tests and rollback from approved requirements."
config_file = "agents/luna-planner.toml"

[agents."luna-dev"]
description = "Implement one approved issue plan within its allowed paths."
config_file = "agents/luna-dev.toml"

[agents."luna-qc"]
description = "Verify acceptance and failure scenarios; may edit tests only."
config_file = "agents/luna-qc.toml"

[agents."luna-reviewer"]
description = "Independently review correctness, contracts and scope; findings only."
config_file = "agents/luna-reviewer.toml"

[agents."luna-security"]
description = "Independently review security-sensitive changes; findings only."
config_file = "agents/luna-security.toml"

[agents."luna-release"]
description = "Verify current-commit evidence and PR hygiene; report merge readiness."
config_file = "agents/luna-release.toml"

[agents."luna-runtime"]
description = "Advise on SteamCMD, Proton, ARK runtime and RCON."
config_file = "agents/luna-runtime.toml"

[agents."luna-db"]
description = "Advise on PostgreSQL, migrations, transactions and locks."
config_file = "agents/luna-db.toml"

[agents."luna-agent"]
description = "Advise on Docker reconciliation and node lifecycle."
config_file = "agents/luna-agent.toml"

[agents."luna-web"]
description = "Advise on React, generated API types, accessibility and UX."
config_file = "agents/luna-web.toml"

[agents."luna-infra"]
description = "Advise on Compose, NFS, private networking and deployment."
config_file = "agents/luna-infra.toml"
